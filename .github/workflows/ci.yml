
name: IRIS MLOps CI

on:
  push:
  pull_request:

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  test:
    name: Data and Model Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Authenticate using Google Workload Identity Federation.
      # No service account JSON key is required.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/633745848938/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-dvc-reader@project-b7900fcb-59af-4f18-b09.iam.gserviceaccount.com'

      - name: Pull DVC data and model
        id: dvc_pull
        run: |
          dvc pull

      - name: Evaluate model
        id: evaluate
        continue-on-error: true
        run: |
          python scripts/evaluate.py

      - name: Run pytest
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ -v | tee pytest-report.txt

      # Generate a report for both push and pull request events.
      - name: Generate CI report
        if: always()
        env:
          TEST_STATUS: ${{ steps.tests.outcome }}
          EVALUATION_STATUS: ${{ steps.evaluate.outcome }}
          DVC_STATUS: ${{ steps.dvc_pull.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = [
              "# IRIS MLOps CI Report",
              "",
              "## Pipeline status",
              "",
              f"- DVC pull: **{os.environ.get('DVC_STATUS', 'not run')}**",
              f"- Model evaluation: **{os.environ.get('EVALUATION_STATUS', 'not run')}**",
              f"- Pytest: **{os.environ.get('TEST_STATUS', 'not run')}**",
              "",
              "## Model evaluation metrics",
              "",
              "| Metric | Value |",
              "|---|---:|",
          ]

          metrics_path = Path("evaluation_metrics.json")

          if metrics_path.exists():
              metrics = json.loads(metrics_path.read_text())
              for name, value in metrics.items():
                  lines.append(f"| {name} | {value:.4f} |")
          else:
              lines.append("| Metrics | Unavailable |")

          lines += [
              "",
              "## Test summary",
              "",
              "See the GitHub Actions job logs for individual test results.",
          ]

          pytest_path = Path("pytest-report.txt")
          if pytest_path.exists():
              lines += [
                  "",
                  "## Pytest output",
                  "",
                  "```text",
                  pytest_path.read_text()[-12000:],
                  "```",
              ]

          Path("report.md").write_text("\n".join(lines) + "\n")
          PY

          cat report.md

      # Set up CML for pull request reporting.
      - name: Set up CML
        if: always() && github.event_name == 'pull_request'
        uses: iterative/setup-cml@v2

      - name: Publish CML report
        if: always() && github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md

      # Publish a comment directly under the commit.
      - name: Publish commit report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            if (!fs.existsSync('report.md')) {
              core.warning('CI report was not generated.');
              return;
            }

            const report = fs.readFileSync('report.md', 'utf8');
            const sha = context.payload.pull_request?.head?.sha || context.sha;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body: report
            });

      # Fail the workflow if any validation step failed.
      - name: Fail workflow if validation failed
        if: always()
        env:
          TEST_STATUS: ${{ steps.tests.outcome }}
          EVALUATION_STATUS: ${{ steps.evaluate.outcome }}
          DVC_STATUS: ${{ steps.dvc_pull.outcome }}
        run: |
          if [ "$DVC_STATUS" != "success" ] || \
             [ "$TEST_STATUS" != "success" ] || \
             [ "$EVALUATION_STATUS" != "success" ]; then
            echo "CI validation failed."
            exit 1
          fi

          echo "All CI validation steps passed."
